# 复制为 config.toml 后按需修改。config.toml 不入库（见 .gitignore）。
[plugin]
enabled = true
config_version = "1.0.0"

[napcat]
# Napcat HTTP 服务地址：本机部署填 127.0.0.1，Docker 部署一般填容器名（如 napcat）
host = "127.0.0.1"
# Napcat WebUI -> 网络配置 -> 添加 HTTP 服务器 里填的端口
port = 9999
# Napcat HTTP 服务的认证 Token，没设置就留空
token = ""
# 选表情用的模型任务名（planner / replyer / utils / tool_use），也可留空用默认模型
llm_task = "planner"
# 单次 Napcat 请求超时（秒）
timeout_seconds = 10

[proactive]
# 是否在普通群聊消息里主动贴表情
enabled = true
# 普通消息触发概率
chance = 0.35
# 命中明显适合回应的关键词时的概率（更高）
keyword_chance = 0.75
# 同一个聊天流的冷却时间（秒），避免刷屏
cooldown_seconds = 180
# 短于这个长度的消息不触发
min_text_length = 2
# 跳过机器人自己发的消息
skip_self_messages = true
# 主动贴表情是否用 LLM 选表情。真机上 LLM 调用可能要 15-20s（如 planner 任务配的是
# LongCat 等大模型），导致表情贴得太慢；关掉后走内置关键词规则，毫秒级、零 LLM 开销。
# 建议：追求"表情跟得快"就关掉（false），追求"表情选得准"就开着（true）
llm_enabled = true
# 主动路径 LLM 选表情的超时（毫秒），超时回退关键词规则；0 = 不限制（死等 LLM）
# 真机日志里 LLM 耗时 19.4s，默认 6000ms 能兜住大部分慢模型场景
llm_timeout_ms = 6000
